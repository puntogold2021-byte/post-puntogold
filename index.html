<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POS - PuntoGold</title>
<style>
:root {
  --bg: #121212;
  --surface: #1E1E1E;
  --card: #2C2C2C;
  --hover: #383838;
  --text: #E0E0E0;
  --text2: #9E9E9E;
  --accent: #BB86FC;
  --success: #69F0AE;
  --error: #CF6679;
  --warning: #FFD740;
  --divider: #424242;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--bg); color:var(--text); font-family:'Segoe UI',sans-serif; height:100vh; overflow:hidden; }


/* LOGIN */
#login-screen { display:flex; align-items:center; justify-content:center; height:100vh; }
.login-box { background:var(--surface); padding:40px; border-radius:12px; width:360px; text-align:center; }
.login-box h1 { color:var(--accent); margin-bottom:8px; font-size:1.5em; }
.login-box p { color:var(--text2); margin-bottom:24px; font-size:0.9em; }
.login-box input { width:100%; padding:12px; margin:8px 0; background:var(--card); border:1px solid var(--divider); border-radius:6px; color:var(--text); font-size:1em; }
.login-box select { width:100%; padding:12px; margin:8px 0; background:var(--card); border:1px solid var(--divider); border-radius:6px; color:var(--text); }
.login-box button { width:100%; padding:12px; margin-top:16px; background:var(--accent); color:#000; border:none; border-radius:6px; font-size:1em; font-weight:600; cursor:pointer; }
.login-box button:hover { opacity:0.9; }
.login-error { color:var(--error); font-size:0.85em; margin-top:8px; }


/* APP */
#app { display:none; height:100vh; flex-direction:column; }
#app.active { display:flex; }


/* HEADER */
.header { background:var(--surface); padding:8px 16px; display:flex; align-items:center; gap:16px; border-bottom:1px solid var(--divider); }
.header .logo { color:var(--accent); font-weight:700; font-size:1.1em; }
.header .info { color:var(--text2); font-size:0.9em; }


/* TOOLBAR */
.toolbar { background:var(--surface); padding:8px 16px; display:flex; gap:8px; align-items:center; border-bottom:1px solid var(--divider); }
.toolbar input { padding:8px 12px; background:var(--card); border:1px solid var(--divider); border-radius:4px; color:var(--text); width:250px; }
.toolbar input:focus { outline:none; border-color:var(--accent); }
.toolbar select { padding:8px; background:var(--card); border:1px solid var(--divider); border-radius:4px; color:var(--text); }
.toolbar button { padding:8px 14px; background:var(--card); border:1px solid var(--divider); border-radius:4px; color:var(--text); cursor:pointer; }
.toolbar button:hover { background:var(--hover); }
.toolbar .qty { width:50px; text-align:center; }


/* MAIN */
.main { flex:1; display:flex; overflow:hidden; }
.products { flex:1; padding:12px; overflow-y:auto; }
.products-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:8px; }
.product-card { background:var(--card); border:1px solid var(--divider); border-radius:8px; padding:10px; cursor:pointer; transition:background 0.1s; }
.product-card:hover { background:var(--hover); }
.product-card .desc { font-size:0.85em; margin-bottom:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.product-card .price { color:var(--accent); font-weight:600; }
.product-card .stock { font-size:0.75em; }
.stock-ok { color:var(--success); }
.stock-low { color:var(--warning); }
.stock-neg { color:var(--error); }


/* CART */
.cart { width:320px; background:var(--surface); border-left:1px solid var(--divider); display:flex; flex-direction:column; }
.cart-header { padding:12px; border-bottom:1px solid var(--divider); font-weight:600; }
.cart-items { flex:1; overflow-y:auto; padding:8px; }
.cart-item { padding:8px; background:var(--card); border-radius:6px; margin-bottom:6px; font-size:0.85em; }
.cart-item .name { margin-bottom:4px; }
.cart-item .row { display:flex; justify-content:space-between; }
.cart-item .remove { color:var(--error); cursor:pointer; font-size:1.1em; }
.cart-footer { padding:12px; border-top:1px solid var(--divider); }
.cart-footer .total { font-size:1.3em; font-weight:700; color:var(--accent); margin-top:8px; }


/* BOTTOM BAR */
.bottom-bar { background:var(--surface); padding:8px 16px; display:flex; gap:8px; border-top:1px solid var(--divider); }
.bottom-bar button { padding:10px 16px; background:var(--card); border:1px solid var(--divider); border-radius:6px; color:var(--text); cursor:pointer; font-size:0.9em; }
.bottom-bar button:hover { background:var(--hover); }
.bottom-bar button.primary { background:var(--accent); color:#000; font-weight:600; }


/* MODAL */
.modal-overlay { display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.7); z-index:100; align-items:center; justify-content:center; }
.modal-overlay.active { display:flex; }
.modal { background:var(--surface); border-radius:12px; padding:24px; width:400px; max-width:90vw; }
.modal h3 { margin-bottom:16px; color:var(--accent); }
.modal input, .modal select { width:100%; padding:10px; margin:6px 0; background:var(--card); border:1px solid var(--divider); border-radius:4px; color:var(--text); }
.modal .actions { display:flex; gap:8px; margin-top:16px; }
.modal .actions button { flex:1; padding:10px; border:none; border-radius:6px; cursor:pointer; font-size:0.95em; }
.modal .btn-confirm { background:var(--accent); color:#000; font-weight:600; }
.modal .btn-cancel { background:var(--card); color:var(--text); border:1px solid var(--divider); }
.modal .vuelto { color:var(--success); font-size:1.1em; margin-top:8px; }
.modal .faltan { color:var(--error); font-size:1.1em; margin-top:8px; }


/* TICKET */
#ticket-screen { display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.9); z-index:200; align-items:center; justify-content:center; }
#ticket-screen.active { display:flex; }
.ticket { background:#fff; color:#000; width:280px; padding:16px; font-family:'Courier New',monospace; font-size:0.85em; }
.ticket .center { text-align:center; }
.ticket .divider { border-top:1px dashed #000; margin:8px 0; }
.ticket table { width:100%; }
.ticket td { padding:2px 0; }
.ticket .total-line { font-weight:700; font-size:1.1em; }


/* PAGINATION */
.pagination { text-align:center; padding:8px; color:var(--text2); font-size:0.85em; }
.pagination button { padding:4px 10px; margin:0 4px; background:var(--card); border:1px solid var(--divider); border-radius:4px; color:var(--text); cursor:pointer; }


/* STOCK VIEW */
#stock-screen { display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:var(--bg); z-index:150; padding:20px; overflow-y:auto; }
#stock-screen.active { display:block; }
#stock-screen table { width:100%; border-collapse:collapse; }
#stock-screen th, #stock-screen td { padding:8px; border:1px solid var(--divider); text-align:left; font-size:0.85em; }
#stock-screen th { background:var(--surface); color:var(--accent); }
#stock-screen .back-btn { margin-bottom:16px; padding:8px 16px; background:var(--card); border:1px solid var(--divider); border-radius:6px; color:var(--text); cursor:pointer; }
</style>
</head>
<body>


<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <h1>🏪 PuntoGold</h1>
    <p>Sistema de Punto de Venta</p>
    <select id="login-sucursal">
      <option value="puntogold">PuntoGold</option>
      <option value="otropunto">Otro Punto</option>
    </select>
    <input type="text" id="login-usuario" placeholder="Usuario" autocomplete="off">
    <input type="password" id="login-password" placeholder="Contraseña">
    <button onclick="doLogin()">Iniciar Sesión</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>


<!-- APP -->
<div id="app">
  <!-- HEADER -->
  <div class="header">
    <span class="logo">🏪 PuntoGold</span>
    <span class="info" id="header-info"></span>
    <span style="margin-left:auto" class="info" id="header-user"></span>
  </div>


  <!-- TOOLBAR -->
  <div class="toolbar">
    <input type="text" id="search" placeholder="🔍 Buscar (código, descripción...)" oninput="debounceSearch()">
    <input type="number" id="qty" class="qty" value="1" min="1">
    <button onclick="searchProducts()">Buscar</button>
    <select id="lista-precio">
      <option value="minorista">Minorista</option>
    </select>
    <button onclick="showStock()">📦 Stock</button>
    <button onclick="logout()">Salir</button>
  </div>


  <!-- MAIN -->
  <div class="main">
    <div class="products">
      <div class="products-grid" id="products-grid"></div>
      <div class="pagination" id="pagination"></div>
    </div>
    <div class="cart">
      <div class="cart-header">🛒 Carrito</div>
      <div class="cart-items" id="cart-items"></div>
      <div class="cart-footer">
        <div class="row" style="display:flex;justify-content:space-between">
          <span>Subtotal:</span><span id="cart-subtotal">$0</span>
        </div>
        <div class="row" style="display:flex;justify-content:space-between">
          <span>Descuento:</span><span id="cart-descuento">$0</span>
        </div>
        <div class="total" style="display:flex;justify-content:space-between">
          <span>TOTAL:</span><span id="cart-total">$0</span>
        </div>
      </div>
    </div>
  </div>


  <!-- BOTTOM BAR -->
  <div class="bottom-bar">
    <button onclick="removeSelected()">🗑️ Quitar</button>
    <button onclick="openDescuento()">🏷️ Descuento</button>
    <button onclick="openCambiarPrecio()">💲 Camb. Precio</button>
    <button onclick="openCambiarCant()">✏️ Cant.</button>
    <button class="primary" onclick="openCobro()">F2 - Cobrar</button>
    <button onclick="nuevaVenta()">F4 - Nueva</button>
  </div>
</div>


<!-- MODAL COBRO -->
<div class="modal-overlay" id="modal-cobro">
  <div class="modal">
    <h3>💰 Cobrar</h3>
    <p style="margin-bottom:12px">Total a cobrar: <strong id="cobro-total" style="color:var(--accent);font-size:1.2em"></strong></p>
    <label>Forma de pago:</label>
    <select id="cobro-metodo" onchange="updateCobro()">
      <option value="efectivo">Efectivo</option>
      <option value="debito">Débito</option>
      <option value="credito">Crédito</option>
      <option value="mp">MercadoPago</option>
    </select>
    <div id="cobro-efectivo-div">
      <label>Recibí:</label>
      <input type="number" id="cobro-recibido" placeholder="0" oninput="updateCobro()">
    </div>
    <div class="vuelto" id="cobro-vuelto"></div>
    <div class="faltan" id="cobro-faltan"></div>
    <div class="actions">
      <button class="btn-cancel" onclick="closeModal('modal-cobro')">Cancelar</button>
      <button class="btn-confirm" id="btn-confirmar-cobro" onclick="confirmarCobro()">Confirmar (Enter)</button>
    </div>
  </div>
</div>


<!-- MODAL DESCUENTO -->
<div class="modal-overlay" id="modal-descuento">
  <div class="modal">
    <h3>🏷️ Descuento</h3>
    <select id="desc-tipo">
      <option value="monto">Monto fijo ($)</option>
      <option value="porcentaje">Porcentaje (%)</option>
    </select>
    <input type="number" id="desc-valor" placeholder="0" min="0">
    <div class="actions">
      <button class="btn-cancel" onclick="closeModal('modal-descuento')">Cancelar</button>
      <button class="btn-confirm" onclick="aplicarDescuento()">Aplicar</button>
    </div>
  </div>
</div>


<!-- MODAL CAMBIAR PRECIO -->
<div class="modal-overlay" id="modal-cambiar-precio">
  <div class="modal">
    <h3>💲 Cambiar Precio</h3>
    <p id="cp-producto"></p>
    <label>¿Aplicar a?</label>
    <select id="cp-alcance">
      <option value="venta">Solo esta venta</option>
      <option value="definitivo">Definitivo (guardar)</option>
    </select>
    <input type="number" id="cp-nuevo" placeholder="Nuevo precio" min="0">
    <div class="actions">
      <button class="btn-cancel" onclick="closeModal('modal-cambiar-precio')">Cancelar</button>
      <button class="btn-confirm" onclick="aplicarCambiarPrecio()">Aplicar</button>
    </div>
  </div>
</div>


<!-- MODAL CAMBIAR CANTIDAD -->
<div class="modal-overlay" id="modal-cambiar-cant">
  <div class="modal">
    <h3>✏️ Cambiar Cantidad</h3>
    <p id="cc-producto"></p>
    <input type="number" id="cc-nueva" placeholder="Nueva cantidad" min="1">
    <div class="actions">
      <button class="btn-cancel" onclick="closeModal('modal-cambiar-cant')">Cancelar</button>
      <button class="btn-confirm" onclick="aplicarCambiarCant()">Aplicar</button>
    </div>
  </div>
</div>


<!-- TICKET -->
<div id="ticket-screen">
  <div class="ticket" id="ticket-content"></div>
  <div style="position:absolute;bottom:40px;text-align:center">
    <button onclick="window.print()" style="padding:12px 24px;background:var(--accent);color:#000;border:none;border-radius:6px;font-size:1em;cursor:pointer">🖨️ Imprimir</button>
    <button onclick="closeTicket()" style="padding:12px 24px;background:var(--card);color:var(--text);border:1px solid var(--divider);border-radius:6px;font-size:1em;cursor:pointer;margin-left:8px">Nueva Venta (F4)</button>
  </div>
</div>


<!-- STOCK VIEW -->
<div id="stock-screen">
  <button class="back-btn" onclick="hideStock()">◄ Volver</button>
  <h2 style="margin-bottom:16px;color:var(--accent)">📦 Stock - Ambos Locales</h2>
  <input type="text" id="stock-search" placeholder="Buscar..." style="padding:8px 12px;background:var(--card);border:1px solid var(--divider);border-radius:4px;color:var(--text);width:300px;margin-bottom:12px">
  <table id="stock-table">
    <thead><tr><th>Producto</th><th>PuntoGold</th><th>Otro Punto</th></tr></thead>
    <tbody id="stock-body"></tbody>
  </table>
</div>


<script>
// ============ CONFIG ============
const API_URL = 'https://script.google.com/macros/s/TU_SCRIPT_ID_ACA/exec';
// ⚠️ REEMPLAZA TU_SCRIPT_ID_ACA con la URL que te dio Apps Script (sin el /exec al final, o con, según cómo la copiaste)


// ============ STATE ============
let currentUser = null;
let currentSucursal = 'puntogold';
let cart = [];
let descuento = 0;
let currentPage = 1;
let selectedCartIndex = -1;
let searchTimeout = null;


// ============ LOGIN ============
async function doLogin() {
  const usuario = document.getElementById('login-usuario').value.trim();
  const password = document.getElementById('login-password').value;
  currentSucursal = document.getElementById('login-sucursal').value;


  if (!usuario || !password) {
    document.getElementById('login-error').textContent = 'Completá usuario y contraseña';
    return;
  }


  try {
    const res = await fetch(`${API_URL}?action=login&usuario=${encodeURIComponent(usuario)}&password=${encodeURIComponent(password)}`);
    const data = await res.json();


    if (data.ok) {
      currentUser = { nombre: data.nombre, rol: data.rol, usuario: usuario };
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('app').classList.add('active');
      document.getElementById('header-info').textContent = `Caja #1 | ${currentSucursal === 'puntogold' ? 'PuntoGold' : 'Otro Punto'}`;
      document.getElementById('header-user').textContent = `👤 ${data.nombre}`;
      loadProducts();
    } else {
      document.getElementById('login-error').textContent = data.error || 'Error de login';
    }
  } catch (e) {
    document.getElementById('login-error').textContent = 'Error de conexión: ' + e.message;
  }
}


function logout() {
  currentUser = null;
  cart = [];
  descuento = 0;
  document.getElementById('app').classList.remove('active');
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('login-password').value = '';
  document.getElementById('login-error').textContent = '';
}


// ============ PRODUCTOS ============
async function loadProducts(page = 1, search = '') {
  currentPage = page;
  const res = await fetch(`${API_URL}?action=productos&sucursal=${currentSucursal}&search=${encodeURIComponent(search)}&page=${page}`);
  const data = await res.json();


  const grid = document.getElementById('products-grid');
  grid.innerHTML = data.items.map((p, i) => {
    const stockClass = p.stock < 0 ? 'stock-neg' : p.stock <= 5 ? 'stock-low' : 'stock-ok';
    return `<div class="product-card" onclick="addToCart(${p.id}, this)" data-id="${p.id}">
      <div class="desc">${p.descripcion}</div>
      <div class="price">$${Number(p.precio).toLocaleString('es-AR')}</div>
      <div class="stock ${stockClass}">Stock: ${p.stock}</div>
    </div>`;
  }).join('');


  // Pagination
  const pag = document.getElementById('pagination');
  if (data.pages > 1) {
    let html = `<button onclick="loadProducts(${page - 1})" ${page <= 1 ? 'disabled' : ''}>◄</button>`;
    html += ` Página ${page} de ${data.pages} (${data.total} productos)`;
    html += `<button onclick="loadProducts(${page + 1})" ${page >= data.pages ? 'disabled' : ''}>►</button>`;
    pag.innerHTML = html;
  } else {
    pag.innerHTML = data.total ? `${data.total} producto(s)` : '';
  }
}


function debounceSearch() {
  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(() => {
    loadProducts(1, document.getElementById('search').value.trim());
  }, 400);
}


function searchProducts() {
  loadProducts(1, document.getElementById('search').value.trim());
}


// ============ CARRITO ============
function addToCart(id, cardEl) {
  const qty = parseInt(document.getElementById('qty').value) || 1;
  const products = document.querySelectorAll('.product-card');
  const idx = Array.from(products).findIndex(p => p.dataset.id == id);
  if (idx < 0) return;


  const p = {
    id: parseInt(id),
    descripcion: cardEl.querySelector('.desc').textContent,
    precio: parseInt(cardEl.querySelector('.price').textContent.replace(/[$,\s]/g, '')) || 0,
    cantidad: qty
  };


  const existing = cart.find(i => i.id === p.id);
  if (existing) {
    existing.cantidad += qty;
  } else {
    cart.push(p);
  }
  updateCart();
}


function updateCart() {
  const div = document.getElementById('cart-items');
  div.innerHTML = cart.map((item, i) => `
    <div class="cart-item" onclick="selectedCartIndex=${i}" style="${i === selectedCartIndex ? 'border:1px solid var(--accent)' : ''}">
      <div class="name">${item.descripcion}</div>
      <div class="row">
        <span>${item.cantidad} x $${Number(item.precio).toLocaleString('es-AR')}</span>
        <span class="remove" onclick="event.stopPropagation();removeFromCart(${i})">✕</span>
      </div>
      <div class="row"><span>= $${Number(item.precio * item.cantidad).toLocaleString('es-AR')}</span></div>
    </div>
  `).join('');


  const subtotal = cart.reduce((s, i) => s + i.precio * i.cantidad, 0);
  document.getElementById('cart-subtotal').textContent = `$${subtotal.toLocaleString('es-AR')}`;
  document.getElementById('cart-descuento').textContent = `$${descuento.toLocaleString('es-AR')}`;
  document.getElementById('cart-total').textContent = `$${(subtotal - descuento).toLocaleString('es-AR')}`;
}


function removeFromCart(index) {
  cart.splice(index, 1);
  selectedCartIndex = -1;
  updateCart();
}


function removeSelected() {
  if (selectedCartIndex >= 0) removeFromCart(selectedCartIndex);
}


function nuevaVenta() {
  cart = [];
  descuento = 0;
  selectedCartIndex = -1;
  updateCart();
  document.getElementById('qty').value = 1;
}


// ============ DESCUENTO ============
function openDescuento() {
  document.getElementById('desc-valor').value = '';
  openModal('modal-descuento');
}


function aplicarDescuento() {
  const tipo = document.getElementById('desc-tipo').value;
  const valor = parseFloat(document.getElementById('desc-valor').value) || 0;
  const subtotal = cart.reduce((s, i) => s + i.precio * i.cantidad, 0);


  if (tipo === 'porcentaje') {
    descuento = Math.round(subtotal * (valor / 100));
  } else {
    descuento = valor;
  }
  if (descuento > subtotal) descuento = subtotal;
  updateCart();
  closeModal('modal-descuento');
}


// ============ CAMBIAR PRECIO ============
function openCambiarPrecio() {
  if (selectedCartIndex < 0) { alert('Seleccioná un producto del carrito'); return; }
  const item = cart[selectedCartIndex];
  document.getElementById('cp-producto').textContent = item.descripcion;
  document.getElementById('cp-nuevo').value = item.precio;
  openModal('modal-cambiar-precio');
}


function aplicarCambiarPrecio() {
  const nuevo = parseFloat(document.getElementById('cp-nuevo').value) || 0;
  cart[selectedCartIndex].precio = nuevo;
  updateCart();
  closeModal('modal-cambiar-precio');
}


// ============ CAMBIAR CANTIDAD ============
function openCambiarCant() {
  if (selectedCartIndex < 0) { alert('Seleccioná un producto del carrito'); return; }
  const item = cart[selectedCartIndex];
  document.getElementById('cc-producto').textContent = `${item.descripcion} (actual: ${item.cantidad})`;
  document.getElementById('cc-nueva').value = item.cantidad;
  openModal('modal-cambiar-cant');
}


function aplicarCambiarCant() {
  const nueva = parseInt(document.getElementById('cc-nueva').value) || 1;
  cart[selectedCartIndex].cantidad = nueva;
  updateCart();
  closeModal('modal-cambiar-cant');
}


// ============ COBRO ============
function openCobro() {
  if (!cart.length) { alert('El carrito está vacío'); return; }
  const total = cart.reduce((s, i) => s + i.precio * i.cantidad, 0) - descuento;
  document.getElementById('cobro-total').textContent = `$${total.toLocaleString('es-AR')}`;
  document.getElementById('cobro-recibido').value = '';
  document.getElementById('cobro-vuelto').textContent = '';
  document.getElementById('cobro-faltan').textContent = '';
  document.getElementById('cobro-efectivo-div').style.display = 'block';
  openModal('modal-cobro');
}


function updateCobro() {
  const metodo = document.getElementById('cobro-metodo').value;
  const total = cart.reduce((s, i) => s + i.precio * i.cantidad, 0) - descuento;
  document.getElementById('cobro-efectivo-div').style.display = metodo === 'efectivo' ? 'block' : 'none';


  if (metodo === 'efectivo') {
    const recibido = parseFloat(document.getElementById('cobro-recibido').value) || 0;
    const vuelto = recibido - total;
    document.getElementById('cobro-vuelto').textContent = recibido >= total && recibido > 0 ? `Vuelto: $${vuelto.toLocaleString('es-AR')}` : '';
    document.getElementById('cobro-faltan').textContent = recibido > 0 && recibido < total ? `Faltan: $${(total - recibido).toLocaleString('es-AR')}` : '';
  } else {
    document.getElementById('cobro-vuelto').textContent = '';
    document.getElementById('cobro-faltan').textContent = '';
  }
}


async function confirmarCobro() {
  const total = cart.reduce((s, i) => s + i.precio * i.cantidad, 0) - descuento;
  const metodo = document.getElementById('cobro-metodo').value;
  const recibido = metodo === 'efectivo' ? (parseFloat(document.getElementById('cobro-recibido').value) || 0) : total;


  if (metodo === 'efectivo' && recibido < total) {
    document.getElementById('cobro-faltan').textContent = `Faltan: $${(total - recibido).toLocaleString('es-AR')}`;
    return;
  }


  // POST venta
  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      contentType: 'text/plain',
      body: JSON.stringify({
        action: 'venta',
        sucursal: currentSucursal,
        usuario: currentUser.usuario,
        items: cart,
        total: total,
        forma_pago: metodo,
        monto_recibido: recibido
      })
    });
    const data = await res.json();


    if (data.ok) {
      closeModal('modal-cobro');
      showTicket(data);
    } else {
      alert('Error: ' + data.error);
    }
  } catch (e) {
    alert('Error de conexión: ' + e.message);
  }
}


// ============ TICKET ============
function showTicket(ventaData) {
  const total = cart.reduce((s, i) => s + i.precio * i.cantidad, 0) - descuento;
  const metodo = document.getElementById('cobro-metodo').value;
  const recibido = metodo === 'efectivo' ? (parseFloat(document.getElementById('cobro-recibido').value) || 0) : total;
  const vuelto = metodo === 'efectivo' ? recibido - total : 0;


  const now = new Date();
  let html = `<div class="center">
    <strong>PuntoGold</strong><br>
    <small>Tel: 11-2345-6789</small><br>
    <small>MP: @puntogold</small>
  </div>
  <div class="divider"></div>
  <div>${now.toLocaleDateString('es-AR')} ${now.toLocaleTimeString('es-AR', {hour:'2-digit',minute:'2-digit'})}</div>
  <div>Cajero: ${currentUser.nombre}</div>
  <div>Ticket: #${ventaData.id_venta}</div>
  <div class="divider"></div>`;


  cart.forEach(item => {
    html += `<table><tr><td>${item.cantidad}x ${item.descripcion}</td><td style="text-align:right">$${(item.precio * item.cantidad).toLocaleString('es-AR')}</td></tr></table>`;
  });


  html += `<div class="divider"></div>
  <table><tr><td>Subtotal</td><td style="text-align:right">$${(total + descuento).toLocaleString('es-AR')}</td></tr></table>`;
  if (descuento > 0) html += `<table><tr><td>Descuento</td><td style="text-align:right">-$${descuento.toLocaleString('es-AR')}</td></tr></table>`;
  html += `<table><tr class="total-line"><td>TOTAL</td><td style="text-align:right">$${total.toLocaleString('es-AR')}</td></tr></table>
  <div class="divider"></div>
  <table><tr><td>${metodo.toUpperCase()}</td><td style="text-align:right">$${recibido.toLocaleString('es-AR')}</td></tr></table>`;
  if (vuelto > 0) html += `<table><tr><td>VUELTO</td><td style="text-align:right">$${vuelto.toLocaleString('es-AR')}</td></tr></table>`;
  html += `<div class="divider"></div>
  <div class="center"><small>¡Gracias por su visita!</small><br><small>No emitimos factura</small></div>`;


  document.getElementById('ticket-content').innerHTML = html;
  document.getElementById('ticket-screen').classList.add('active');
}


function closeTicket() {
  document.getElementById('ticket-screen').classList.remove('active');
  nuevaVenta();
  loadProducts();
}


// ============ STOCK VIEW ============
async function showStock() {
  document.getElementById('stock-screen').classList.add('active');
  try {
    const res = await fetch(`${API_URL}?action=stock`);
    const data = await res.json();
    const tbody = document.getElementById('stock-body');
    tbody.innerHTML = data.items.map(p => `
      <tr>
        <td>${p.descripcion}</td>
        <td style="color:${p.stock_puntogold <= 0 ? 'var(--error)' : p.stock_puntogold <= 5 ? 'var(--warning)' : 'var(--success)'}">${p.stock_puntogold}</td>
        <td style="color:${p.stock_otropunto <= 0 ? 'var(--error)' : p.stock_otropunto <= 5 ? 'var(--warning)' : 'var(--success)'}">${p.stock_otropunto}</td>
      </tr>
    `).join('');
  } catch (e) {
    document.getElementById('stock-body').innerHTML = `<tr><td colspan="3">Error: ${e.message}</td></tr>`;
  }
}


function hideStock() {
  document.getElementById('stock-screen').classList.remove('active');
}


// ============ MODALS ============
function openModal(id) { document.getElementById(id).classList.add('active'); }
function closeModal(id) { document.getElementById(id).classList.remove('active'); }


// ============ KEYBOARD SHORTCUTS ============
document.addEventListener('keydown', (e) => {
  // No interferir si está escribiendo en un input
  const tag = document.activeElement.tagName;
  const isInput = tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA';


  if (e.key === 'F2') { e.preventDefault(); if (!isInput) openCobro(); }
  if (e.key === 'F4') { e.preventDefault(); if (!isInput) { closeTicket(); nuevaVenta(); loadProducts(); } }
  if (e.key === 'F5') { e.preventDefault(); if (!isInput) showStock(); }
  if (e.key === 'Escape') {
    document.querySelectorAll('.modal-overlay.active').forEach(m => m.classList.remove('active'));
    hideStock();
  }
  // Enter en modal de cobro = confirmar
  if (e.key === 'Enter' && document.getElementById('modal-cobro').classList.contains('active')) {
    e.preventDefault();
    confirmarCobro();
  }
});


// Enter en login
document.getElementById('login-password').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') doLogin();
});
</script>
